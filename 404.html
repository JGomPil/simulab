    'radionav/apps/beaconsim.html': 'radionav/apps/BeaconSim.html',
    'radionav/apps/radarsim.html': 'radionav/apps/RadarSim.html',
    'datalab/apps/biodatasim.html': 'datalab/apps/BioDataSim.html'
  };
  var match = /^(.*?\/)((?:neurolab|radionav|datalab)\/.*)$/.exec(location.pathname);
  var target = match && moved[match[2]];
  if (target) location.replace(match[1] + target + location.search + location.hash);
})();
</script>
